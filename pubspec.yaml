name: wyrm_desk
description: >-
  Ambient Android tablet desk companion and smart dashboard featuring a live
  daylight clock, habit heatmap, calendar milestones, priority tasks, and a
  zero-install local Wi-Fi web remote.
publish_to: "none"

version: 1.0.4+5

homepage: https://github.com/jydv402/wyrm
repository: https://github.com/jydv402/wyrm
issue_tracker: https://github.com/jydv402/wyrm/issues

environment:
  sdk: ^3.14.0

# Runtime Dependencies
dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.4

  # UI, Design System & Motion
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.0.17
  material_ui: ^1.11.0
  motor: ^1.1.0
  qr_flutter: ^4.1.0

  # Local Server & Networking
  http: ^1.2.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

  # Platform, Device & Storage
  battery_plus: ^7.1.2
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.1
  package_info_plus: ^10.2.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.1
  wakelock_plus: ^1.8.0

  # Utilities
  clock: ^1.1.1
  intl: ^0.20.3
  qr: ^3.0.2
  timezone: ^0.11.0

# Development & Build Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  package_rename: ^1.10.1

# Flutter Assets & Typography
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/web/
    - assets/card_bg/clock/
    - assets/card_bg/task/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google_sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf
        - asset: assets/fonts/google_sans/GoogleSans-Italic-VariableFont_GRAD,opsz,wght.ttf
          style: italic
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
