<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WYRM Desk — Remote Companion</title>

  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="/style.css">

  <!-- Core Controller JavaScript Engine -->
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Centered Application Viewport -->
  <div class="app-container">

    <!-- Top Navigation Header with Authentic Brand Wordmark, Center Page Switcher, and Network Pill -->
    <header class="app-header">
      <!-- Left: Authentic WYRM Wordmark from assets/icons/header_text.svg -->
      <div class="header-brand" title="WYRM Desk">

          <path d="M272.706 15L300.282 15.0355C300.014 23.6981 298.396 29.6915 294.238 37.2046C292.455 40.0335 290.766 42.3617 288.469 44.8115C280.465 53.4309 269.291 58.4085 257.531 58.5928C245.913 58.8649 234.668 54.4803 226.3 46.4145C217.796 38.179 212.997 26.8446 213 15.0051L240.68 15.0117C241.13 18.4751 241.641 20.9468 243.636 23.9296C245.962 27.4245 249.605 29.827 253.733 30.5871C257.862 31.3552 262.127 30.4263 265.564 28.0102C270.426 24.6168 271.765 20.5084 272.706 15Z" fill="currentColor"/>

          <path d="M198.875 102.024L118.884 102.082C121.623 95.641 124.648 91.8894 129.544 87.1096C132.72 84.3865 135.517 82.3521 139.275 80.4408C149.679 75.2492 161.723 74.4067 172.75 78.0987C185.245 82.2697 193.192 90.4931 198.875 102.024Z" fill="currentColor"/>

        </svg>
      </div>

      <!-- Center: Center-Aligned Capsule Page Switcher -->
      <nav class="page-switcher" aria-label="Card Switcher">
        <button id="tab-all" class="switcher-pill active" onclick="window.wyrmRemote.setCardFilter('all')">All</button>
        <button id="tab-clock" class="switcher-pill" onclick="window.wyrmRemote.setCardFilter('clock')">Clock</button>
        <button id="tab-habits" class="switcher-pill" onclick="window.wyrmRemote.setCardFilter('habits')">Habits</button>
        <button id="tab-calendar" class="switcher-pill" onclick="window.wyrmRemote.setCardFilter('calendar')">Calendar</button>
        <button id="tab-tasks" class="switcher-pill" onclick="window.wyrmRemote.setCardFilter('tasks')">Tasks</button>
      </nav>

      <!-- Right: Live Connection Telemetry Badge -->
      <div id="networkBadge" class="network-badge" title="Connection Telemetry">
        <span class="pulse-dot"></span>
        <span id="networkLabel">CONNECTING...</span>
      </div>
    </header>

    <!-- Main Single Column Layout Cards Stream -->
    <main class="cards-stream">

      <!-- 1. Clock Card -->
      <article id="card-clock" class="layout-card" data-card="clock">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-glyph">⏱</span>
            <span class="card-name">Clock Card</span>
          </div>
          <span id="clockStatusBadge" class="status-capsule">SMALL</span>
        </div>

        <div class="segmented-bar four-segment">
          <button id="clock-small" class="segment-btn" onclick="window.wyrmRemote.setCardSize('clock', 'small')">Small</button>
          <button id="clock-medium" class="segment-btn" onclick="window.wyrmRemote.setCardSize('clock', 'medium')">Medium</button>
          <button id="clock-fullscreen" class="segment-btn" onclick="window.wyrmRemote.setCardSize('clock', 'fullscreen')">Full</button>
          <button id="clock-nightstand" class="segment-btn amber" onclick="window.wyrmRemote.setCardSize('clock', 'nightstand')">🌙 Night</button>
        </div>

        <div class="setting-row">
          <div class="setting-desc">
            <span class="setting-title">24-Hour Format</span>
            <span class="setting-subtext">Toggle between 12h (AM/PM) and 24h</span>
          </div>
          <div id="timeFormatToggle" class="switch-pill" role="switch" aria-checked="false" onclick="window.wyrmRemote.toggleTimeFormat()">
            <div class="switch-thumb"></div>
          </div>
        </div>
      </article>

      <!-- 2. Habits Card -->
      <article id="card-habits" class="layout-card" data-card="habits">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-glyph">⚡</span>
            <span class="card-name">Habits Card</span>
          </div>
          <span id="habitsStatusBadge" class="status-capsule">SMALL</span>
        </div>

        <div class="segmented-bar">
          <button id="habits-small" class="segment-btn" onclick="window.wyrmRemote.setCardSize('habits', 'small')">Small</button>
          <button id="habits-medium" class="segment-btn" onclick="window.wyrmRemote.setCardSize('habits', 'medium')">Medium</button>
          <button id="habits-fullscreen" class="segment-btn" onclick="window.wyrmRemote.setCardSize('habits', 'fullscreen')">Full</button>
        </div>
      </article>

      <!-- 3. Calendar Card -->
      <article id="card-calendar" class="layout-card" data-card="calendar">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-glyph">📅</span>
            <span class="card-name">Calendar Card</span>
          </div>
          <span id="calendarStatusBadge" class="status-capsule">SMALL</span>
        </div>

        <div class="segmented-bar">
          <button id="calendar-small" class="segment-btn" onclick="window.wyrmRemote.setCardSize('calendar', 'small')">Small</button>
          <button id="calendar-medium" class="segment-btn" onclick="window.wyrmRemote.setCardSize('calendar', 'medium')">Medium</button>
          <button id="calendar-fullscreen" class="segment-btn" onclick="window.wyrmRemote.setCardSize('calendar', 'fullscreen')">Full</button>
        </div>
      </article>

      <!-- 4. Tasks Card -->
      <article id="card-tasks" class="layout-card" data-card="tasks">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-glyph">☑️</span>
            <span class="card-name">Tasks Card</span>
          </div>
          <span id="tasksStatusBadge" class="status-capsule">SMALL</span>
        </div>

        <div class="segmented-bar">
          <button id="tasks-small" class="segment-btn" onclick="window.wyrmRemote.setCardSize('tasks', 'small')">Small</button>
          <button id="tasks-medium" class="segment-btn" onclick="window.wyrmRemote.setCardSize('tasks', 'medium')">Medium</button>
          <button id="tasks-fullscreen" class="segment-btn" onclick="window.wyrmRemote.setCardSize('tasks', 'fullscreen')">Full</button>
        </div>
      </article>

    </main>

  </div>
</body>
</html>
